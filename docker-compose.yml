services:
  postgres:
    image: postgres:17
    container_name: ulbra-one-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ulbra_one
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ulbra_one"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/API/Ulbra.One.Api/Dockerfile
    container_name: ulbra-one-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=ulbra_one;Username=postgres;Password=postgres

  web:
    image: node:23-alpine
    container_name: ulbra-one-web
    working_dir: /app
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5001/api
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@latest --activate &&
             pnpm install &&
             pnpm dev --host 0.0.0.0"

volumes:
  pg_data:
  web_node_modules:
