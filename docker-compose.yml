services:
  postgres:
    image: postgres:17
    container_name: ulbra-one-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ulbra_one
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ulbra_one"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ulbra-one-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ulbra-one-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/API/Ulbra.One.Api/Dockerfile
    container_name: ulbra-one-api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=ulbra_one;Username=postgres;Password=postgres
      ObjectStorage__Endpoint: http://minio:9000
      ObjectStorage__AccessKey: minioadmin
      ObjectStorage__SecretKey: minioadmin
      ObjectStorage__Bucket: ulbra-one-attachments
      MassTransit__Host: rabbitmq
      MassTransit__User: guest
      MassTransit__Password: guest

  web:
    image: node:23-alpine
    container_name: ulbra-one-web
    working_dir: /app
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5001/api
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: >
      sh -c "corepack enable &&
             pnpm install --config.minimumReleaseAge=0 &&
             pnpm dev --host 0.0.0.0"

volumes:
  pg_data:
  minio_data:
  rabbitmq_data:
  web_node_modules:
