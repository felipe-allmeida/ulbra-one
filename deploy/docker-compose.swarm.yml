# Docker Swarm stack for ULBRA One (DEV).
# Deployed by .github/workflows/deploy.yml via `docker stack deploy`.
# Shares the external `proxy` (Traefik) and `monitoring` (OTel/observability)
# overlay networks with the SAU stack on the same swarm.
version: "3.9"

services:
  api:
    image: ${API_IMAGE}
    networks:
      - proxy
      - internal
      - monitoring
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING}
      Authentication__JwtSecret: ${JWT_SECRET}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID_VALUE}
      AllowedOrigins__0: https://${WEB_HOST}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ulbra-one
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${ENV_SLUG}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-512M}
          cpus: "${API_CPU_LIMIT:-0.5}"
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        - "traefik.http.routers.ulbra-one-api-${ENV_SLUG}.rule=Host(`${API_HOST}`)"
        - "traefik.http.routers.ulbra-one-api-${ENV_SLUG}.entrypoints=websecure"
        - "traefik.http.routers.ulbra-one-api-${ENV_SLUG}.tls=true"
        - "traefik.http.routers.ulbra-one-api-${ENV_SLUG}.tls.certresolver=letsencrypt"
        - "traefik.http.services.ulbra-one-api-${ENV_SLUG}.loadbalancer.server.port=8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${WEB_IMAGE}
    networks:
      - proxy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-128M}
          cpus: "${WEB_CPU_LIMIT:-0.25}"
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        - "traefik.http.routers.ulbra-one-web-${ENV_SLUG}.rule=Host(`${WEB_HOST}`)"
        - "traefik.http.routers.ulbra-one-web-${ENV_SLUG}.entrypoints=websecure"
        - "traefik.http.routers.ulbra-one-web-${ENV_SLUG}.tls=true"
        - "traefik.http.routers.ulbra-one-web-${ENV_SLUG}.tls.certresolver=letsencrypt"
        - "traefik.http.services.ulbra-one-web-${ENV_SLUG}.loadbalancer.server.port=80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ulbra_one
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ulbra_one"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-512M}
          cpus: "${POSTGRES_CPU_LIMIT:-0.5}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
  monitoring:
    external: true
  internal:
    driver: overlay

volumes:
  pgdata:
