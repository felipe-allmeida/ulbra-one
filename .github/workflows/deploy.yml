name: Deploy

# DEV-only deploy. Builds API + Web images, pushes to GHCR, then deploys the
# Swarm stack on the shared self-hosted [self-hosted, ulbra] runner via Traefik.
# No staging/production jobs.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual DEV redeploy

env:
  REGISTRY: ghcr.io
  APP_NAME: ulbra-one

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (build + unit tests + vuln audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Ulbra.One.slnx
      - name: Audit shipped dependencies for vulnerabilities
        run: |
          dotnet list src/API/Ulbra.One.Api/Ulbra.One.Api.csproj package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable" vuln.txt; then
            echo "::error::Vulnerable package(s) detected in the shipped API project"; exit 1
          fi
      - name: Build (Release)
        run: dotnet build Ulbra.One.slnx -c Release --no-restore
      - name: Run unit tests
        run: dotnet test tests/Ulbra.One.UnitTests -c Release --no-build

  build:
    name: Build & push images
    needs: verify
    runs-on: [self-hosted, ulbra]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/API/Ulbra.One.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ steps.sha.outputs.tag }}

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ steps.sha.outputs.tag }}

  deploy-dev:
    name: Deploy (dev)
    needs: build
    runs-on: [self-hosted, ulbra]
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy stack
        env:
          ENV_SLUG: dev
          API_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ needs.build.outputs.image_tag }}
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ needs.build.outputs.image_tag }}
          API_HOST: ${{ vars.API_HOST }}
          WEB_HOST: ${{ vars.WEB_HOST }}
          ASPNETCORE_ENVIRONMENT: ${{ vars.ASPNETCORE_ENVIRONMENT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID_VALUE: ${{ secrets.GOOGLE_CLIENT_ID_VALUE }}
          DATABASE_CONNECTION_STRING: Host=postgres;Port=5432;Database=ulbra_one;Username=${{ secrets.POSTGRES_USER }};Password=${{ secrets.POSTGRES_PASSWORD }}
          VITE_API_BASE_URL: https://${{ vars.API_HOST }}/api
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_VALUE }}
          VITE_ENVIRONMENT: development
          API_MEMORY_LIMIT: 512M
          API_CPU_LIMIT: "0.5"
          WEB_MEMORY_LIMIT: 128M
          WEB_CPU_LIMIT: "0.25"
          POSTGRES_MEMORY_LIMIT: 512M
          POSTGRES_CPU_LIMIT: "0.5"
        run: |
          docker stack deploy \
            --with-registry-auth \
            --prune \
            --detach=false \
            -c deploy/docker-compose.swarm.yml \
            ${{ env.APP_NAME }}-dev

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::stack services"
          docker stack services ${{ env.APP_NAME }}-dev || true
          echo "::endgroup::"
          for svc in api web postgres; do
            echo "::group::${{ env.APP_NAME }}-dev_${svc} ps"
            docker stack ps ${{ env.APP_NAME }}-dev --no-trunc \
              --filter "name=${{ env.APP_NAME }}-dev_${svc}" || true
            echo "::endgroup::"
            echo "::group::${{ env.APP_NAME }}-dev_${svc} logs"
            docker service logs --tail 200 ${{ env.APP_NAME }}-dev_${svc} || true
            echo "::endgroup::"
          done
