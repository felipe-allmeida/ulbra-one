name: Deploy
run-name: "deploy(${{ inputs.promote_to && format('{0} ← {1}', inputs.promote_to, inputs.image_tag) || 'dev' }})"

# Azure Container Apps deploy via Terraform + OIDC (no stored client secrets).
# Mirrors the ulbra-sau deploy ergonomics, but targets Azure instead of Swarm:
#   - push to main           → build images to ACR + deploy DEV automatically
#   - workflow_dispatch       → promote an ALREADY-built image_tag to PROD (no rebuild)
# Requires the one-time infra/bootstrap/bootstrap.sh before the first run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_to:
        description: "Ambiente destino"
        required: true
        type: choice
        options: [prod]
      image_tag:
        description: "SHA curto da build (ex.: abc1234). Pega na aba Actions → último deploy dev."
        required: true
        type: string

permissions:
  id-token: write   # required for OIDC token request
  contents: read

concurrency:
  group: deploy-${{ inputs.promote_to || 'dev' }}
  cancel-in-progress: false

env:
  ACR_NAME: crulbraone
  ACR_LOGIN_SERVER: crulbraone.azurecr.io
  TF_WORKING_DIR: infra/terraform
  TF_BACKEND_RG: rg-ulbraone-tfstate
  TF_BACKEND_SA: stulbraonetfstate
  TF_BACKEND_CONTAINER: tfstate
  # Public Google OAuth client id (frontend + backend audience). Set a GOOGLE_CLIENT_ID
  # repo/environment variable to override per-env (e.g. a dedicated prod client).
  GOOGLE_CLIENT_ID_DEFAULT: 867854924898-uvv5b8h238cb2ctg3te66vri829dckla.apps.googleusercontent.com

jobs:
  # ── Automático: push na main → build + push das imagens pro ACR ─────
  build:
    name: Build & push images to ACR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Definir tag
        id: sha
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/API/Ulbra.One.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/api:${{ steps.sha.outputs.tag }}

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/web:${{ steps.sha.outputs.tag }}

  # ── Deploy: DEV no push; PROD por dispatch promovendo um tag existente ──
  deploy:
    name: Deploy → ${{ github.event_name == 'push' && 'dev' || inputs.promote_to }}
    needs: build
    # push: espera o build. dispatch (promote): build é pulado, então roda mesmo assim.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'push' && 'dev' || inputs.promote_to }}
    env:
      TARGET_ENV: ${{ github.event_name == 'push' && 'dev' || inputs.promote_to }}
      IMAGE_TAG: ${{ github.event_name == 'push' && needs.build.outputs.image_tag || inputs.image_tag }}
      RESOURCE_GROUP: rg-ulbraone-${{ github.event_name == 'push' && 'dev' || inputs.promote_to }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (${{ env.TARGET_ENV }})
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.TF_BACKEND_RG }}" \
            -backend-config="storage_account_name=${{ env.TF_BACKEND_SA }}" \
            -backend-config="container_name=${{ env.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ env.TARGET_ENV }}.tfstate"

      - name: Terraform apply (${{ env.TARGET_ENV }})
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_ai_api_key: ${{ secrets.AI_API_KEY }}
          TF_VAR_postgres_admin_login: ${{ secrets.POSTGRES_ADMIN_LOGIN }}
        run: |
          # *.tfvars are gitignored (they hold local secrets), so non-secret config is passed
          # inline; secrets come from GitHub Secrets via TF_VAR_* above. Other vars
          # (location, replicas, sku, tags) use their defaults in variables.tf.
          terraform apply -auto-approve \
            -var="environment=${{ env.TARGET_ENV }}" \
            -var="google_client_id=${{ vars.GOOGLE_CLIENT_ID || env.GOOGLE_CLIENT_ID_DEFAULT }}" \
            -var="web_custom_domain=${{ vars.WEB_CUSTOM_DOMAIN }}" \
            -var="api_image=${{ env.ACR_LOGIN_SERVER }}/api:${{ env.IMAGE_TAG }}" \
            -var="web_image=${{ env.ACR_LOGIN_SERVER }}/web:${{ env.IMAGE_TAG }}"
          echo "✅ Deploy ${{ env.TARGET_ENV }} concluído. Tag: ${{ env.IMAGE_TAG }}"

      - name: Diagnostics on failure
        if: failure()
        run: |
          for app in ca-ulbraone-api-${{ env.TARGET_ENV }} ca-ulbraone-web-${{ env.TARGET_ENV }}; do
            echo "::group::revisions $app"
            az containerapp revision list -n "$app" -g "${{ env.RESOURCE_GROUP }}" -o table || true
            echo "::endgroup::"
            echo "::group::logs $app"
            az containerapp logs show -n "$app" -g "${{ env.RESOURCE_GROUP }}" --tail 100 --type console || true
            echo "::endgroup::"
          done
